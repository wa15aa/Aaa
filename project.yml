name: Steady
options:
  bundleIdPrefix: sh.steadyhabit
  deploymentTarget:
    iOS: "16.0"
packages:
  StreakEngine:
    path: StreakEngine
targets:
  Steady:
    type: application
    platform: iOS
    sources: [Steady]
    settings:
      base:
        SWIFT_VERSION: "5.0"
        PRODUCT_NAME: Steady
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/Frameworks"]
        # W7 Widget：App Group 共享 CoreData
        CODE_SIGN_ENTITLEMENTS: Steady/Steady.entitlements
      configs:
        Debug:
          ONLY_ACTIVE_ARCH: YES
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    dependencies:
      - package: StreakEngine
        product: SteadyCore
        embed: true
      - target: SteadyWidget
        embed: true
        codeSignOnCopy: true
    info:
      path: Steady/Info.plist
      properties:
        UILaunchScreen_Generation: YES
        # 空 dict 启用全屏启动（修 letterbox 黑边）；必须在这里声明，xcodegen 重生成 Info.plist 才不会丢
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CFBundleDisplayName: Steady
        # 仅用 Apple 系统 CryptoKit 加密备份 → 免出口合规自证
        ITSAppUsesNonExemptEncryption: NO
  SteadyWidget:
    type: app-extension
    platform: iOS
    sources: [SteadyWidget]
    settings:
      base:
        SWIFT_VERSION: "5.0"
        PRODUCT_NAME: SteadyWidget
        PRODUCT_BUNDLE_IDENTIFIER: sh.steadyhabit.Steady.Widget
        CODE_SIGN_ENTITLEMENTS: SteadyWidget/SteadyWidget.entitlements
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/Frameworks", "@executable_path/../../Frameworks"]
      configs:
        Debug:
          ONLY_ACTIVE_ARCH: YES
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    dependencies:
      - package: StreakEngine
        product: SteadyCore
        embed: true
    info:
      path: SteadyWidget/Info.plist
      properties:
        CFBundleDisplayName: Steady Widget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  SteadyTests:
    type: bundle.unit-test
    platform: iOS
    sources: [SteadyTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        PRODUCT_NAME: SteadyTests
        PRODUCT_BUNDLE_IDENTIFIER: sh.steadyhabit.SteadyTests
      configs:
        Debug:
          ONLY_ACTIVE_ARCH: YES
    dependencies:
      - target: Steady
      - package: StreakEngine
        product: SteadyCore
schemes:
  Steady:
    build:
      targets:
        Steady: all
        SteadyWidget: all
        SteadyTests: [test]
    test:
      targets: [SteadyTests]
