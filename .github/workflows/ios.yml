name: iOS CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build StreakEngine package
        working-directory: StreakEngine
        run: swift build

      - name: Run assertion harnesses
        working-directory: StreakEngine
        run: |
          .build/debug/streakcheck
          .build/debug/repocheck
          .build/debug/backupcheck

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build iOS app (simulator)
        run: |
          set -o pipefail
          if ! xcodebuild -project Steady.xcodeproj -scheme Steady \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath DerivedData build | tee build.log; then
            { echo '## ❌ xcodebuild failed — last errors'; echo '```';
              grep -iE 'error:|warning: .*deprecated' build.log | head -40;
              echo '--- tail ---'; tail -40 build.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
