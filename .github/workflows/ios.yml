name: iOS CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build StreakEngine package
        working-directory: StreakEngine
        run: swift build

      - name: Run assertion harnesses
        working-directory: StreakEngine
        run: |
          .build/debug/streakcheck
          .build/debug/repocheck
          .build/debug/backupcheck

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build iOS app (simulator)
        run: |
          xcodebuild -project Steady.xcodeproj -scheme Steady \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -derivedDataPath DerivedData build
